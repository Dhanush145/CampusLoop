services:
  # Backend API Service (Django REST Framework with SQLite)
  - type: web
    name: campusloop-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOW_ALL
        value: "True"

  # Frontend Web Service (Next.js 16)
  - type: web
    name: campusloop-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://campusloop-api.onrender.com/api


