version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campusloop-db
    environment:
      POSTGRES_DB: campusloop
      POSTGRES_USER: campusloop
      POSTGRES_PASSWORD: campusloop123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusloop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

